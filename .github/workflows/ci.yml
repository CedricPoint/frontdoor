name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  offline:
    name: the checks need no network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the catalogue is judged without reaching anything
        run: node --test test/checks.test.js
      - name: a bad invocation is still a clean error
        run: |
          if node bin/frontdoor.js --nonsense; then
            echo "an unknown option should not succeed" && exit 1
          fi
